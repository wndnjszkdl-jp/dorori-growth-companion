  <style>
    :root{--ink:#25313a;--mint:#72d8bd;--deep:#276e6a;--sky:#e8f5fa;--cream:#fffdfa;--line:#e5eceb;--soft:#f4fbf8}*{box-sizing:border-box}body{margin:0;background:#dfe9ea;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;font-size:16px}.app{width:100%;min-height:100svh;max-width:460px;margin:auto;background:var(--cream);overflow:hidden;position:relative}.screen{min-height:100svh;padding:calc(22px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));display:none;flex-direction:column}.screen.active{display:flex}.welcome{background:linear-gradient(180deg,#ccecff 0%,#e9f8ff 52%,#d9f0bf 100%);text-align:center;align-items:center}.cloud{position:absolute;border-radius:999px;background:rgba(255,255,255,.64);filter:blur(1px)}.c1{width:130px;height:48px;top:120px;left:-48px}.c2{width:120px;height:42px;top:230px;right:-48px}.brand{font-weight:900;font-size:2.3rem;letter-spacing:-.08em;margin-top:44px}.sub{font-size:.83rem;font-weight:600;margin-top:2px}.mascot{margin:auto 0 18px;width:220px;height:240px;position:relative}.body{position:absolute;width:170px;height:165px;border-radius:48% 52% 44% 46%;bottom:13px;left:25px;background:radial-gradient(circle at 36% 28%,#eafff8 0 5%,#baf5e1 27%,#76d8bc 67%,#53b99f 100%);box-shadow:inset -14px -12px 22px rgba(25,121,105,.14),0 16px 22px rgba(47,111,83,.16)}.sprout{position:absolute;top:11px;left:99px;width:22px;height:32px;border-left:5px solid #4da66d;transform:rotate(-5deg)}.leaf{position:absolute;width:28px;height:16px;background:#7dd66d;border-radius:100% 0 100% 0;top:1px;left:107px;transform:rotate(-18deg)}.leaf:after{content:'';position:absolute;width:28px;height:16px;background:#99e988;border-radius:0 100% 0 100%;left:-31px;top:8px;transform:rotate(45deg)}.eye{position:absolute;width:7px;height:9px;border-radius:999px;background:#34464e;top:82px}.e1{left:67px}.e2{right:68px}.mouth{position:absolute;width:21px;height:10px;border-bottom:3px solid #34464e;border-radius:50%;top:102px;left:75px}.cup{position:absolute;bottom:38px;left:0;width:39px;height:51px;background:#a96d40;border-radius:5px 5px 15px 15px;transform:rotate(-12deg);border-top:7px solid #f2e6d1;box-shadow:inset 7px 0 rgba(255,255,255,.18)}.bubble{position:absolute;right:-2px;top:86px;background:white;padding:13px;border-radius:20px;font-size:.82rem;font-weight:700;box-shadow:0 8px 20px rgba(56,100,100,.1)}.cta{border:0;background:#25292c;color:white;border-radius:18px;min-height:55px;width:100%;font-size:1rem;font-weight:800;cursor:pointer}.linkbtn{background:transparent;border:0;margin-top:14px;font-weight:700;color:#45515a;font-size:.9rem;cursor:pointer}.top{display:flex;align-items:center;justify-content:space-between}.back{border:0;background:transparent;font-size:1.8rem;padding:0;color:var(--ink);cursor:pointer}.step{font-size:.82rem;font-weight:800;color:var(--deep);background:#def7ef;padding:7px 10px;border-radius:99px}.h1{font-size:1.65rem;line-height:1.35;letter-spacing:-.055em;margin:33px 0 8px}.lead{color:#657078;font-size:.94rem;line-height:1.55;margin:0 0 25px}.question{border:1px solid var(--line);background:white;border-radius:20px;overflow:hidden}.qtitle{font-weight:850;font-size:1.05rem;padding:18px 18px 8px}.answers{padding:6px 12px 14px}.answer{display:flex;width:100%;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:13px 6px;border-radius:12px;font:inherit;color:inherit;cursor:pointer}.answer+.answer{border-top:1px solid #eef2f0}.answer .mark{width:21px;height:21px;border:2px solid #ccd8d6;border-radius:50%;flex:0 0 auto}.answer.selected{background:#f1fcf8}.answer.selected .mark{border:6px solid var(--mint)}.answer b{font-size:.92rem}.answer small{display:block;color:#6e777c;font-size:.76rem;margin-top:3px}.progress{display:flex;gap:5px;margin:18px 0}.progress i{height:5px;flex:1;border-radius:99px;background:#e7eeee}.progress i.on{background:var(--mint)}.next{margin-top:auto}.result{text-align:center;align-items:center;background:linear-gradient(180deg,#ecfbff,#fffdf9 58%)}.result .mascot{transform:scale(.85);margin:0 0 -8px}.result h2{font-size:1.6rem;letter-spacing:-.06em;margin:20px 0 6px}.typepill{background:#d5f8ed;color:#176d60;padding:8px 13px;border-radius:99px;font-weight:900}.card{background:white;border:1px solid var(--line);box-shadow:0 10px 28px rgba(50,87,87,.07);border-radius:20px;padding:18px;text-align:left;width:100%;margin:12px 0 22px;line-height:1.6;font-size:.91rem}.home{padding-bottom:92px;background:#f9fdfb}.hello{font-size:1.35rem;font-weight:900;letter-spacing:-.06em;margin:23px 0 2px}.today{color:#66747a;font-size:.88rem}.hero{margin-top:18px;border-radius:24px;padding:18px;background:linear-gradient(120deg,#c8f7e9,#e8fcf6);min-height:166px;position:relative;overflow:hidden}.hero .body{transform:scale(.63);transform-origin:bottom left;left:-18px;bottom:-25px}.hero .sprout{transform:scale(.63);transform-origin:top left;left:49px;top:8px}.hero .leaf{transform:scale(.63);transform-origin:top left;left:57px;top:2px}.hero .cup{transform:scale(.63);left:4px;bottom:6px}.hero .eye,.hero .mouth{display:none}.herocopy{margin-left:118px}.level{font-size:.76rem;font-weight:800;color:#30756c}.hero h3{margin:6px 0;font-size:1.12rem}.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.8);margin-top:10px;overflow:hidden}.bar span{display:block;width:46%;height:100%;background:#52cdb2;border-radius:inherit}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.mini div{border-radius:16px;background:white;border:1px solid var(--line);text-align:center;padding:12px 5px;font-size:.74rem}.mini strong{display:block;font-size:1.08rem;margin-top:3px}.section-title{font-weight:900;margin:24px 0 10px}.mission{border:1px solid var(--line);border-radius:17px;padding:14px;background:#fff;display:flex;gap:12px;align-items:center}.mission button{margin-left:auto;border:0;background:var(--mint);width:28px;height:28px;border-radius:50%;color:#10564c;font-weight:900;cursor:pointer}.nav{position:absolute;left:0;right:0;bottom:0;padding:11px 17px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid var(--line);display:flex;justify-content:space-around}.nav button{border:0;background:transparent;font-size:.72rem;color:#809095;display:flex;gap:4px;flex-direction:column;align-items:center;cursor:pointer}.nav button.on{color:#176c60;font-weight:900}.chat{padding-bottom:90px;background:linear-gradient(180deg,#f0fbf7,#fff)}.chathead{display:flex;align-items:center;gap:12px;margin:9px 0 18px}.avatar{width:45px;height:45px;border-radius:50%;background:#9debd5;display:grid;place-items:center;font-size:1.45rem}.chathead b{display:block}.chathead small{color:#638078}.talk{display:flex;flex-direction:column;gap:12px;flex:1}.msg{max-width:82%;padding:12px 14px;border-radius:17px;font-size:.92rem;line-height:1.48}.bot{background:white;border:1px solid var(--line);border-top-left-radius:5px}.me{align-self:flex-end;background:#c8f6e8;border-top-right-radius:5px}.chips{display:flex;gap:7px;overflow:auto;padding:8px 0}.chips button{white-space:nowrap;border:1px solid #b6e9d9;border-radius:99px;padding:8px 11px;background:#f4fffb;color:#256c62;font-weight:700;cursor:pointer}.composer{display:flex;gap:8px;background:white;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));position:absolute;bottom:0;left:0;right:0}.composer input{min-width:0;flex:1;border:1px solid #d9e5e1;border-radius:14px;padding:12px;font:inherit}.composer button{width:47px;border:0;border-radius:14px;background:#273032;color:#fff;font-weight:800;cursor:pointer}@media(min-width:700px){body{padding:20px}.app{min-height:calc(100svh - 40px);border-radius:30px;box-shadow:0 20px 60px rgba(32,58,63,.22)}}

<body><main class="app">
  <section class="screen welcome active" id="welcome"><div class="cloud c1"></div><div class="cloud c2"></div><div class="brand">dorori</div><div class="sub">나를 키우는 작은 습관</div><div class="mascot"><div class="sprout"></div><div class="leaf"></div><div class="body"><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div><div class="cup"></div><div class="bubble">오늘도<br>수고했어!</div></div><button class="cta" onclick="go('quiz')">시작하기</button><button class="linkbtn" onclick="go('home')">이미 나의 친구가 있어요</button></section>
  <section class="screen" id="quiz"><div class="top"><button class="back" onclick="go('welcome')">‹</button><span class="step" id="step">1 / 5</span></div><h1 class="h1" id="qtext"></h1><p class="lead">지금의 나에게 가장 가까운 답을 골라주세요.</p><div class="progress" id="progress"></div><div class="question"><div class="qtitle">나의 오늘 패턴</div><div class="answers" id="answers"></div></div><button class="cta next" id="next" onclick="nextQ()">다음</button></section>
  <section class="screen result" id="result"><span class="typepill">나의 오늘 패턴</span><h2 id="resultTitle"></h2><div class="mascot"><div class="sprout"></div><div class="leaf"></div><div class="body"><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div><div class="cup"></div></div><div class="card" id="resultCopy"></div><button class="cta" onclick="go('home')">내 친구와 함께 시작하기</button></section>
  <section class="screen home" id="home"><div class="top"><span class="step">오늘의 돌봄</span><button class="back" onclick="go('chat')">💬</button></div><div class="hello">안녕, 수빈님! ☀️</div><div class="today">오늘도 잘 하고 있어요.</div><div class="hero"><div class="sprout"></div><div class="leaf"></div><div class="body"></div><div class="cup"></div><div class="herocopy"><div class="level" id="homeType">Lv. 07 · 방전형 Roy</div><h3>작은 충전을<br>선물해볼까요?</h3><div class="bar"><span></span></div><small>230 / 500 잎사귀</small></div></div><div class="mini"><div>🌿<strong>42</strong>집중</div><div>💗<strong>57</strong>실행</div><div>☀️<strong>35</strong>관계</div></div><div class="section-title">오늘의 성장 퀘스트</div><div class="mission"><span>💧</span><span><b>물 한 잔으로 하루 시작하기</b><br><small>+ 10 잎사귀</small></span><button onclick="this.textContent='✓'; this.style.background='#baf1d7'">+</button></div><div class="mission" style="margin-top:10px"><span>👟</span><span><b>10분 산책하기</b><br><small>+ 15 잎사귀</small></span><button onclick="this.textContent='✓'; this.style.background='#baf1d7'">+</button></div><nav class="nav"><button class="on" onclick="go('home')">⌂<span>오늘</span></button><button onclick="go('quiz')">◌<span>다시 찾기</span></button><button onclick="go('chat')">◉<span>친구와 대화</span></button></nav></section>
  <section class="screen chat" id="chat"><div class="chathead"><button class="back" onclick="go('home')">‹</button><div class="avatar">🌱</div><div><b id="chatName">Roy</b><small>오늘 곁에 있는 친구</small></div></div><div class="talk" id="talk"><div class="msg bot">왔구나. 오늘은 어떤 하루였어? 한 문장이어도 괜찮아.</div></div><div class="chips"><button onclick="quick('에너지가 바닥났어')">에너지가 바닥났어</button><button onclick="quick('마음이 복잡해')">마음이 복잡해</button><button onclick="quick('작은 일부터 할래')">작은 일부터 할래</button></div><div class="composer"><input id="input" placeholder="오늘의 마음을 들려줘" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">↑</button></div></section>
</main><script>
const types=[['Roy','방전형','에너지가 금방 떨어지는 편','따뜻한 마음을 가진 당신. 오늘은 ‘충전’이 우선이에요. 물 한 잔, 창밖 보기처럼 아주 작은 휴식부터 시작해요.'],['obby','생각과다형','생각이 너무 많아지는 편','생각이 많다는 건 그만큼 진지하다는 뜻이에요. 지금은 한 가지 생각만 종이에 적고, 나머지는 잠시 내려두어도 돼요.'],['popo','미룸형','해야 할 일을 자꾸 미루는 편','시작이 무거운 날도 있어요. 딱 3분만 해보는 약속으로 오늘의 문을 열어볼까요?'],['mumu','눈치형','다른 사람의 시선이 신경 쓰이는 편','주변을 살피는 마음은 다정함이에요. 오늘 한 번은 “나는 어떻게 하고 싶지?”를 먼저 물어봐요.'],['nugu','벽쌓기형','혼자 괜찮다고 말하는 편','혼자 버텨온 시간이 있었네요. 믿을 수 있는 사람에게 “오늘 조금 힘들어”라고 말해도 괜찮아요.'],['Nabi','길잃음형','무엇부터 해야 할지 모르는 편','길을 잃은 게 아니라 잠시 멈춘 거예요. 오늘 할 일 중 가장 쉬운 하나만 골라볼까요?'],['pingo','도파민형','재미있는 것에 자꾸 끌리는 편','호기심은 멋진 엔진이에요. 재미를 포기하지 말고, 해야 할 일 뒤에 작은 보상으로 붙여봐요.'],['bamba','꾹참형','속마음을 잘 참는 편','참아온 마음이 많았을 거예요. 지금 이 순간의 감정을 한 단어로 이름 붙여주세요.'],['moa','나몰라형','문제가 와도 모른 척하고 싶은 편','피하고 싶은 마음도 나를 지키려는 신호예요. 문제를 전부 보지 말고, 가장 작은 조각만 바라봐요.']];
const questions=[['요즘 가장 자주 하는 말은?',[[0,'“나 너무 지쳤어.”'],[1,'“생각이 멈추질 않아.”'],[2,'“조금 있다가 할게.”']]],['해야 할 일이 생기면?',[[2,'시작할 타이밍을 계속 미뤄요.'],[5,'무엇부터 해야 할지 모르겠어요.'],[7,'일단 참고 혼자 해내요.']]],['사람들 사이에서는?',[[3,'상대가 어떻게 볼지 신경 써요.'],[4,'거리를 두고 혼자 있는 편이에요.'],[8,'복잡해지면 관심을 꺼버려요.']]],['마음이 복잡할 때?',[[1,'머릿속에서 경우의 수를 계속 떠올려요.'],[6,'재미있는 것으로 기분을 바꾸려 해요.'],[7,'티 내지 않고 꾹 참아요.']]],['오늘의 나에게 가장 가까운 모습은?',[[0,'멈춰서 쉬고 싶어요.'],[5,'나만의 방향이 필요해요.'],[3,'내 마음보다 다른 사람을 먼저 봐요.']]]];let qi=0,choice=null,scores=Array(9).fill(0),active=0;
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='quiz')renderQ();}
function renderQ(){choice=null;document.getElementById('step').textContent=`${qi+1} / ${questions.length}`;document.getElementById('qtext').textContent=questions[qi][0];document.getElementById('progress').innerHTML=questions.map((_,i)=>`<i class="${i<=qi?'on':''}"></i>`).join('');document.getElementById('answers').innerHTML=questions[qi][1].map((a,i)=>`<button class="answer" onclick="pick(${i})"><i class="mark"></i><span><b>${a[1]}</b><small>가장 가까운 쪽을 골라주세요</small></span></button>`).join('');document.getElementById('next').textContent=qi===4?'나의 친구 만나기':'다음'}function pick(i){choice=i;document.querySelectorAll('.answer').forEach((x,j)=>x.classList.toggle('selected',j===i))}function nextQ(){if(choice===null){document.querySelector('.qtitle').textContent='하나를 골라주세요 :)';return}scores[questions[qi][1][choice][0]]++;if(qi<4){qi++;renderQ()}else{active=scores.indexOf(Math.max(...scores));showResult()}}function showResult(){let t=types[active];document.getElementById('resultTitle').textContent=`${t[1]} ${t[0]} 입니다!`;document.getElementById('resultCopy').innerHTML=`<b>${t[2]}</b><br>${t[3]}`;document.getElementById('homeType').textContent=`Lv. 07 · ${t[1]} ${t[0]}`;document.getElementById('chatName').textContent=t[0];localStorage.setItem('dororiType',active);go('result')}function quick(s){document.getElementById('input').value=s;send()}function send(){let input=document.getElementById('input'),v=input.value.trim();if(!v)return;let talk=document.getElementById('talk');talk.innerHTML+=`<div class="msg me">${v.replace(/[<>]/g,'')}</div>`;input.value='';let t=types[active],reply=v.includes('지')||v.includes('힘')?`그랬구나. ${t[0]}가 잠깐 곁에 있을게. 오늘은 잘하려 애쓰기보다, 지금의 나를 돌보는 한 가지면 충분해.`:v.includes('할래')?`좋아. ${t[0]}와 약속! 가장 쉬운 것부터 3분만 해보고, 끝나면 꼭 알려줘.`:`${t[0]}가 들었어. “${v}”라고 느끼는구나. 그 마음을 알아차린 것만으로도 오늘의 한 걸음이야.`;setTimeout(()=>{talk.innerHTML+=`<div class="msg bot">${reply}</div>`;talk.scrollTop=talk.scrollHeight},400)}let saved=localStorage.getItem('dororiType');if(saved!==null){active=+saved;let t=types[active];document.getElementById('homeType').textContent=`Lv. 07 · ${t[1]} ${t[0]}`;document.getElementById('chatName').textContent=t[0]}
</script></body></html>
